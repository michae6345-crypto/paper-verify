[project]
name = "paper-verify"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "TexSoup>=0.3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# The Postgres store (§14.9 step 5). An extra rather than a dependency: with no
# DATABASE_URL the process runs entirely on the in-memory stores, and the test
# suite is network-free and driver-free. `psycopg` 3.2 is the floor —
# `Connection.notifies(timeout=...)` is what lets one listener connection add a
# channel without dropping the ones it already holds (§15.1).
db = ["psycopg[binary,pool]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
